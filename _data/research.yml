# Research themes. Shown as four equal cards on the home page; each links to
# its section on /research/ (the `id` is the anchor). Keep blurbs to about
# 30 words so the cards stay the same height.
- id: obliquities
  title: "Stellar obliquities"
  role: "OATMEAL survey"
  blurb: "The tilt between a star's spin and its companion's orbit records how that companion arrived. I co-founded the OATMEAL survey to measure these tilts for brown dwarfs and compare them with hot Jupiters."

- id: demographics
  title: "Population-level planet statistics"
  role: "Demographics"
  blurb: "Using large surveys like TESS and the California Legacy Survey, I measure how populations of planets and brown dwarfs change with host-star properties such as temperature and metallicity."

- id: tess
  title: "Exoplanet discovery with TESS"
  role: "Software · TRICERATOPS"
  blurb: "TRICERATOPS, a Bayesian tool I built to separate real planets from false positives using TESS data alone, is now credited with more than 200 planet discoveries."

- id: formation
  title: "Planet formation and evolution"
  role: "Theory & atmospheres"
  blurb: "Simulations of high-eccentricity migration and of dust carried outward by disk winds, plus a survey of brown dwarf atmospheres that traces where these objects formed."
