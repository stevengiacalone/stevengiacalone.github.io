# Site settings for stevengiacalone.github.io
#
# Most of the content lives in plain-text data files, so updating the site
# rarely means touching HTML:
#   _data/research.yml    research themes (home-page cards)
#   _data/experience.yml  positions, education, awards, telescope time, teaching, service, talks
#   _publications/*.md    one file per paper (front matter = metadata, body = abstract)
#   index.html            the About paragraph
#   research.html         the long-form research page

title: "Steven Giacalone"
description: "Steven Giacalone is an NSF Astronomy & Astrophysics Postdoctoral Fellow at Caltech who studies how exoplanets and brown dwarfs form and evolve."
url: "https://stevengiacalone.github.io"
baseurl: ""
locale: "en-US"
timezone: "America/Los_Angeles"

author:
  name: "Steven Giacalone"
  pronouns: "he/him"
  title: "NSF Astronomy & Astrophysics Postdoctoral Fellow"
  employer: "California Institute of Technology"
  employer_url: "https://www.astro.caltech.edu/"
  location: "Pasadena, California"
  email: "giacalone@astro.caltech.edu"
  photo: "/images/profile-sm.jpg"
  cv: "/files/CV_StevenGiacalone.pdf"
  github: "stevengiacalone"
  orcid: "0000-0002-8965-3969"
  googlescholar: "https://scholar.google.com/citations?user=lfzkbtcAAAAJ&hl=en"
  arxiv: "https://arxiv.org/search/astro-ph?searchtype=author&query=Giacalone,+S"
  nasaads: "https://ui.adsabs.harvard.edu/search/fq=%7B!type%3Daqp%20v%3D%24fq_database%7D&fq_database=(database%3Aastronomy%20OR%20database%3Aphysics)&q=%20author%3A%22Giacalone%2C%20S%22&sort=date%20desc%2C%20bibcode%20desc&p_=0"
  address:
    - "Cahill Center for Astronomy and Astrophysics"
    - "MC 249-17"
    - "1216 East California Blvd"
    - "Pasadena, CA 91125"

collections:
  publications:
    output: true
    permalink: /publication/:path/

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - node_modules
