# Site settings for stevengiacalone.github.io
#
# Most of the content lives in plain-text data files, so updating the site
# rarely means touching HTML:
#   _data/research.yml    research themes (home-page cards)
#   _publications/*.md    one file per paper (front matter = metadata, body = abstract);
#                         only papers with first_author: true are listed
#   index.html            the About paragraph
#   research.html         the long-form research page

title: "Steven Giacalone"
description: "Steven Giacalone is a Postdoctoral Researcher at the NASA Exoplanet Science Institute (Caltech/IPAC) who studies how planetary systems form and evolve."
url: "https://stevengiacalone.github.io"
baseurl: ""
locale: "en-US"
timezone: "America/Los_Angeles"

author:
  name: "Steven Giacalone"
  pronouns: "he/him"
  title: "Postdoctoral Researcher"
  employer: "NASA Exoplanet Science Institute (Caltech/IPAC)"
  employer_url: "https://nexsci.caltech.edu/"
  location: "Pasadena, California"
  email: "steveng@caltech.edu"
  photo: "/images/profile-sm.jpg"
  cv: "/files/CV_StevenGiacalone.pdf"
  github: "stevengiacalone"
  orcid: "0000-0002-8965-3969"
  googlescholar: "https://scholar.google.com/citations?user=lfzkbtcAAAAJ&hl=en"
  arxiv: "https://arxiv.org/search/astro-ph?searchtype=author&query=Giacalone,+S"
  scix: "https://scixplorer.org/search?p=1&q=author%3A%22giacalone%2C+s%22+property%3Arefereed&sort=date+desc&d=general"
  linkedin: "https://www.linkedin.com/in/steven-giacalone-a2b934323"
  address:
    - "NASA Exoplanet Science Institute"
    - "California Institute of Technology"
    - "1200 East California Blvd"
    - "Pasadena, CA 91125"

collections:
  publications:
    output: true
    permalink: /publication/:path/

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - node_modules
